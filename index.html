<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cantina Militar - Autoatendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#fffbeb',  /* amber-50 */
                100: '#fef3c7', /* amber-100 */
                500: '#f59e0b', /* amber-500 */
                600: '#d97706', /* amber-600 */
                700: '#b45309', /* amber-700 */
                900: '#78350f', /* amber-900 */
              }
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(135, 100, 31, 0.07)', /* Sombra ajustada para tom quente */
              'kiosk': '0 10px 40px -10px rgba(0,0,0,0.08)',
              'float': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        /* Mesh Gradient Background ajustado para tons de Amarelo/Laranja suave */
        background-color: #fffbf0;
        background-image: 
          radial-gradient(at 0% 0%, hsla(37,90%,92%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(45,80%,94%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(37,90%,92%,1) 0, transparent 50%);
        background-attachment: fixed;
        color: #1f2937;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      
      /* Animações */
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up {
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.99); }
        to { opacity: 1; transform: none; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d8; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a1a1aa; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "pocketbase": "https://esm.sh/pocketbase@0.21.5",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2",
    "xlsx": "https://esm.sh/xlsx@0.18.5"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</body>
</html>
